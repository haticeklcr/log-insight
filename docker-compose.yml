services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-loginsight}
      POSTGRES_USER: ${DB_USERNAME:-loginsight}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loginsight}
    volumes:
      - log-insight-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-loginsight} -d ${DB_NAME:-loginsight}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_LOG_ANALYSIS_MAX_FILE_SIZE: ${APP_LOG_ANALYSIS_MAX_FILE_SIZE:-10MB}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-loginsight}
      DB_USERNAME: ${DB_USERNAME:-loginsight}
      DB_PASSWORD: ${DB_PASSWORD:-loginsight}
      ANALYSIS_EXECUTOR_CORE_POOL_SIZE: ${ANALYSIS_EXECUTOR_CORE_POOL_SIZE:-2}
      ANALYSIS_EXECUTOR_MAX_POOL_SIZE: ${ANALYSIS_EXECUTOR_MAX_POOL_SIZE:-4}
      ANALYSIS_EXECUTOR_QUEUE_CAPACITY: ${ANALYSIS_EXECUTOR_QUEUE_CAPACITY:-50}
      ANALYSIS_EXECUTOR_THREAD_NAME_PREFIX: ${ANALYSIS_EXECUTOR_THREAD_NAME_PREFIX:-log-analysis-}
      ANALYSIS_JOB_MAX_RETRY: ${ANALYSIS_JOB_MAX_RETRY:-3}
      ANALYSIS_JOB_PROGRESS_INTERVAL: ${ANALYSIS_JOB_PROGRESS_INTERVAL:-100}
      ANALYSIS_TEMP_DIRECTORY: ${ANALYSIS_TEMP_DIRECTORY:-/tmp/log-insight}
      LOG_FORMAT_DETECTION_SAMPLE_SIZE: ${LOG_FORMAT_DETECTION_SAMPLE_SIZE:-50}
      LOG_FORMAT_CONFIDENCE_THRESHOLD: ${LOG_FORMAT_CONFIDENCE_THRESHOLD:-60}
      LOG_FORMAT_DETECTION_MAX_SAMPLE_SIZE: ${LOG_FORMAT_DETECTION_MAX_SAMPLE_SIZE:-2000}
      ENVELOPE_DETECTION_ENABLED: ${ENVELOPE_DETECTION_ENABLED:-true}
      ENVELOPE_DETECTION_CONFIDENCE_THRESHOLD: ${ENVELOPE_DETECTION_CONFIDENCE_THRESHOLD:-80}
      MAX_STACK_TRACE_LINES: ${MAX_STACK_TRACE_LINES:-500}
      MAX_LOG_LINE_LENGTH: ${MAX_LOG_LINE_LENGTH:-10000}
      MAX_DISTINCT_LOGGERS: ${MAX_DISTINCT_LOGGERS:-200}
      MAX_DISTINCT_ERROR_GROUPS: ${MAX_DISTINCT_ERROR_GROUPS:-500}
      MAX_TIMELINE_BUCKETS: ${MAX_TIMELINE_BUCKETS:-500}
      MAX_UNPARSED_LINE_PERCENTAGE: ${MAX_UNPARSED_LINE_PERCENTAGE:-50}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/data/log-insight/uploads}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE:-8MB}
      UPLOAD_SESSION_TTL: ${UPLOAD_SESSION_TTL:-24h}
      UPLOAD_PARALLELISM: ${UPLOAD_PARALLELISM:-4}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-}
      UPLOAD_MAX_ACTIVE_SESSIONS: ${UPLOAD_MAX_ACTIVE_SESSIONS:-5}
      UPLOAD_DISK_RESERVE: ${UPLOAD_DISK_RESERVE:-5GB}
      MERGE_PROGRESS_INTERVAL_MS: ${MERGE_PROGRESS_INTERVAL_MS:-2000}
      MERGE_EXECUTOR_CORE_POOL_SIZE: ${MERGE_EXECUTOR_CORE_POOL_SIZE:-2}
      MERGE_EXECUTOR_MAX_POOL_SIZE: ${MERGE_EXECUTOR_MAX_POOL_SIZE:-4}
      MERGE_EXECUTOR_QUEUE_CAPACITY: ${MERGE_EXECUTOR_QUEUE_CAPACITY:-50}
      MERGE_EXECUTOR_THREAD_NAME_PREFIX: ${MERGE_EXECUTOR_THREAD_NAME_PREFIX:-upload-merge-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  log-insight-postgres-data:
    name: log-insight-postgres-data