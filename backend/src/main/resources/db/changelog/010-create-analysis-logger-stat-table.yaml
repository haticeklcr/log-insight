databaseChangeLog:
  - changeSet:
      id: 010-create-analysis-logger-stat-table
      author: hatice
      changes:
        - createTable:
            tableName: analysis_logger_stat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: log_analysis_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: logger_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: entry_count
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: analysis_logger_stat
            baseColumnNames: log_analysis_id
            referencedTableName: log_analysis
            referencedColumnNames: id
            constraintName: fk_analysis_logger_stat_log_analysis
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: analysis_logger_stat