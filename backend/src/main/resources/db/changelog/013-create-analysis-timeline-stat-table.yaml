databaseChangeLog:
  - changeSet:
      id: 013-create-analysis-timeline-stat-table
      author: hatice
      changes:
        - createTable:
            tableName: analysis_timeline_stat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: log_analysis_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: bucket_start
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: total_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: info_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: warn_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: error_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: exception_count
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: analysis_timeline_stat
            baseColumnNames: log_analysis_id
            referencedTableName: log_analysis
            referencedColumnNames: id
            constraintName: fk_analysis_timeline_stat_log_analysis
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: analysis_timeline_stat