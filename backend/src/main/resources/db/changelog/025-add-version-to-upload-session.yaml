databaseChangeLog:
  - changeSet:
      id: 025-add-version-to-upload-session
      author: hatice
      changes:
        - addColumn:
            tableName: upload_session
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: upload_session
            columns:
              - column:
                  name: version