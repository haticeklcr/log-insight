databaseChangeLog:
  - changeSet:
      id: 012-create-http-stat-tables
      author: hatice
      changes:
        - createTable:
            tableName: analysis_status_code_stat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: log_analysis_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status_code
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: entry_count
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: analysis_status_code_stat
            baseColumnNames: log_analysis_id
            referencedTableName: log_analysis
            referencedColumnNames: id
            constraintName: fk_analysis_status_code_stat_log_analysis
            onDelete: CASCADE
        - createTable:
            tableName: analysis_http_method_stat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: log_analysis_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: http_method
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: entry_count
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: analysis_http_method_stat
            baseColumnNames: log_analysis_id
            referencedTableName: log_analysis
            referencedColumnNames: id
            constraintName: fk_analysis_http_method_stat_log_analysis
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: analysis_status_code_stat
        - dropTable:
            tableName: analysis_http_method_stat